services:
  app:
    build: .
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      IMPORT_KEY: ${IMPORT_KEY}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  moon:
    build: .
    user: "65534:65534"
    command: ["python", "moon_server.py"]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 32
    read_only: true
    tmpfs:
      - /tmp:size=8m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  moon-nginx:
    image: nginx:1.28-alpine
    depends_on: [moon]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MOON_PORT:-8088}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/moon.conf:/etc/nginx/conf.d/default.conf:ro
    # max_size is an eviction target; tmpfs is the hard storage ceiling.
    tmpfs:
      - /var/cache/moon:size=80m,mode=1777
      - /var/cache/nginx:size=4m,mode=1777
      - /var/run:size=1m
      - /tmp:size=4m
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 32
    read_only: true
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
