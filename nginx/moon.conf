# Included inside nginx's http context. Validate the entire query BEFORE cache.
log_format moon '$time_iso8601 "$request" status=$status bytes=$body_bytes_sent '
                'cache=$upstream_cache_status request_s=$request_time upstream_s=$upstream_response_time';
map $args $moon_query_valid {
    default 0;
    "" 1;
    "~^(?!.*width=[^&]*&.*width=)(?!.*height=[^&]*&.*height=)(?!.*style=[^&]*&.*style=)(?!.*background-color=[^&]*&.*background-color=)(?:width=(?:3[2-9]|[4-9][0-9]|[1-9][0-9]{2}|10[01][0-9]|102[0-4])|height=(?:3[2-9]|[4-9][0-9]|[1-9][0-9]{2}|10[01][0-9]|102[0-4])|style=(?:real|voyage)|background-color=%23(?:[a-fA-F0-9]{3}|[a-fA-F0-9]{6}))(?:&(?:width=(?:3[2-9]|[4-9][0-9]|[1-9][0-9]{2}|10[01][0-9]|102[0-4])|height=(?:3[2-9]|[4-9][0-9]|[1-9][0-9]{2}|10[01][0-9]|102[0-4])|style=(?:real|voyage)|background-color=%23(?:[a-fA-F0-9]{3}|[a-fA-F0-9]{6}))){0,3}$" 1;
}
map $args $moon_background {
    default transparent;
    "~(?:^|&)background-color=%23([a-fA-F0-9]{3}(?:[a-fA-F0-9]{3})?)(?:&|$)" $1;
}
map $moon_background $moon_background_query {
    transparent "";
    default "&background-color=%23$moon_background";
}
map $arg_width $moon_width { "" 128; default $arg_width; }
map $arg_height $moon_height { "" 128; default $arg_height; }
map $arg_style $moon_style { "" voyage; default $arg_style; }
map $request_method $moon_method_valid { default 0; GET 1; HEAD 1; }
map $status $moon_error_cache_control { default ""; ~^[45] no-store; }
map $status $moon_retry_after { default ""; 429 10; 503 20; }

limit_req_zone $binary_remote_addr zone=moon_requests:1m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=moon_connections:1m;
proxy_cache_path /var/cache/moon levels=1:2 keys_zone=moon_images:2m
                 max_size=64m inactive=24h use_temp_path=off;
upstream moon_backend { server moon:8080; }

server {
    access_log /dev/stdout moon;
    listen 8080 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 1k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 4k;
    keepalive_timeout 10s;
    send_timeout 10s;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control $moon_error_cache_control always;
    add_header Retry-After $moon_retry_after always;

    location = /moon.png {
        if ($moon_method_valid = 0) { return 405; }
        if ($moon_query_valid = 0) { return 400; }
        limit_req zone=moon_requests burst=10 nodelay;
        limit_req_status 429;
        limit_conn moon_connections 8;
        limit_conn_status 429;

        proxy_pass http://moon_backend/moon.png?width=$moon_width&height=$moon_height&style=$moon_style$moon_background_query;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host moon;
        proxy_set_header Connection "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_send_timeout 5s;
        proxy_next_upstream off;

        proxy_cache moon_images;
        proxy_cache_key "moon-v4:$moon_width:$moon_height:$moon_style:$moon_background";
        proxy_cache_methods GET HEAD;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 35s;
        proxy_cache_lock_age 35s;
        proxy_cache_valid 200 1s;
        proxy_cache_use_stale off;
        proxy_cache_background_update off;
        proxy_cache_revalidate off;
        # Preserve creation time: a HIT must not extend downstream max-age.
        proxy_pass_header Date;
        proxy_hide_header Retry-After;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Moon-Cache $upstream_cache_status always;
        add_header Cache-Control $moon_error_cache_control always;
        add_header Retry-After $moon_retry_after always;
    }
    location / { return 404; }
}
